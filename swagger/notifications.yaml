paths:
  /api/notifications:
    get:
      tags:
        - Notifications
      summary: List my in-app notifications
      description: >
        Returns the calling user's in-app notifications, newest first, with the
        total and current unread count. A user can only ever see their own
        notifications.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: unread
          schema:
            type: string
            enum: ['true', 'false']
          description: When 'true', returns only unread notifications
        - in: query
          name: page
          schema:
            type: integer
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Notification page
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Notification'
                      total:
                        type: integer
                      unreadCount:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/notifications/unread-count:
    get:
      tags:
        - Notifications
      summary: My unread notification count
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      unreadCount:
                        type: integer
                        example: 3
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/notifications/read-all:
    post:
      tags:
        - Notifications
      summary: Mark all my notifications read
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All marked read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      modified:
                        type: integer
                        example: 3
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/notifications/{id}/read:
    post:
      tags:
        - Notifications
      summary: Mark one notification read
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification marked read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Notification'
        '400':
          description: Invalid notification id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Notification not found (or not owned by the caller)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Notification:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        companyId:
          type: string
          nullable: true
        type:
          type: string
          enum:
            - STORE_PAYMENT_PAID
            - STORE_PAYMENT_FLAGGED
        title:
          type: string
          example: Payment request marked paid
        body:
          type: string
        entityType:
          type: string
          example: lead
        entityId:
          type: string
          nullable: true
        read:
          type: boolean
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

tags:
  - name: Notifications
    description: In-app notifications (operational events; recipient-scoped, no customer PII).
