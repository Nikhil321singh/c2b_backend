paths:
  /api/profile/user/edit:
    post:
      tags:
        - Profile
      summary: Edit user profile
      description: Update user profile information
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - website
                - companyName
                - address
                - managerName
                - pincode
                - email
                - phoneNumber
              properties:
                firstName:
                  type: string
                  example: John
                lastName:
                  type: string
                  example: Doe
                website:
                  type: string
                  example: https://example.com
                companyName:
                  type: string
                  example: Tech Corp
                address:
                  type: string
                  example: 123 Main Street, Mumbai
                managerName:
                  type: string
                  example: Jane Smith
                pincode:
                  type: string
                  example: '400001'
                email:
                  type: string
                  format: email
                  example: john@example.com
                phoneNumber:
                  type: string
                  example: '9876543210'
      responses:
        '200':
          description: User profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User data updated successfully
                  user:
                    type: object
                    properties:
                      _id:
                        type: string
                        example: 60d5ec49f1b2c72b8c8e4f1a
                      name:
                        type: string
                        example: John Doe
                      email:
                        type: string
                        example: john@example.com
                      role:
                        type: string
                        example: user
                      state:
                        type: string
                        example: Maharashtra
                      city:
                        type: string
                        example: Mumbai
                      address:
                        type: string
                      companyName:
                        type: string
                      firstName:
                        type: string
                      lastName:
                        type: string
                      managerName:
                        type: string
                      pincode:
                        type: string
                      website:
                        type: string
                      profileImage:
                        type: string
                      phoneNumber:
                        type: string
        '400':
          description: Bad request - All fields are required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/profile/user/upload/Profile_image:
    post:
      tags:
        - Profile
      summary: Upload profile image
      description: Upload a profile image for the user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - Profileimage
              properties:
                Profileimage:
                  type: string
                  format: binary
                  description: Profile image file to upload
      responses:
        '200':
          description: Profile image uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Profile image uploaded and user data updated successfully!
                  profileImageLink:
                    type: string
                    example: https://s3.amazonaws.com/bucket/profile-image.jpg
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/profile/user/delete/Profile_image:
    delete:
      tags:
        - Profile
      summary: Delete profile image
      description: Delete the user's profile image from S3 and database
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile image deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Profile image deleted and user data updated successfully!
                  data:
                    type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
