  /api/prospects/Admincalculate:
    post:
      tags:
        - Prospects (Leads)
      summary: Admin calculate price
      description: Calculate or recalculate device price based on admin assessment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - leadId
                - adminAnswer
              properties:
                leadId:
                  type: string
                  example: 60d5ec49f1b2c72b8c8e4f1a
                  description: Lead ID to recalculate
                adminAnswer:
                  type: object
                  description: Admin's assessment of the device condition
                  properties:
                    Core:
                      type: array
                      items:
                        type: object
                    Display:
                      type: array
                      items:
                        type: object
                    Functional_major:
                      type: array
                      items:
                        type: object
                    Functional_minor:
                      type: array
                      items:
                        type: object
                    Cosmetics:
                      type: array
                      items:
                        type: object
                    Warranty:
                      type: array
                      items:
                        type: object
                    Functional:
                      type: array
                      items:
                        type: object
                    Accessories:
                      type: array
                      items:
                        type: object
      responses:
        '200':
          description: Price calculated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 60d5ec49f1b2c72b8c8e4f1a
                      price:
                        type: number
                        example: 22000
                      grade:
                        type: string
                        example: B+
                      uniqueCode:
                        type: string
                  message:
                    type: string
                    example: Price calculated successfully
        '400':
          description: Bad request - Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
