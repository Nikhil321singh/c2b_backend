paths:
  /api/lqdprices/pricesUpdate:
    post:
      tags:
        - Liquidator Prices
      summary: Update liquidator prices
      description: Upload and update liquidator prices from price sheet file
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - PriceSheet
              properties:
                PriceSheet:
                  type: string
                  format: binary
                  description: Price sheet file containing liquidator pricing data (Excel/CSV format)
                liquidatorId:
                  type: string
                  example: 60d5ec49f1b2c72b8c8e4f1a
                  description: ID of the liquidator to update prices for
                effectiveDate:
                  type: string
                  format: date
                  example: '2024-01-01'
                  description: Date when prices become effective
      responses:
        '200':
          description: Liquidator prices updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Liquidator prices updated successfully
                  data:
                    type: object
                    properties:
                      totalProcessed:
                        type: integer
                        example: 150
                      updated:
                        type: integer
                        example: 100
                      created:
                        type: integer
                        example: 50
        '400':
          description: Bad request - invalid file or data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Invalid price sheet format
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Failed to update liquidator prices
                  error:
                    type: string
