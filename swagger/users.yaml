paths:
  /api/users/login:
    post:
      tags:
        - Users
      summary: User login
      description: Authenticate user and get JWT token (24h access token and 7d refresh token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  authToken:
                    type: string
                    description: Access token valid for 24 hours
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken:
                    type: string
                    description: Refresh token valid for 7 days
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  profile:
                    type: object
                    properties:
                      _id:
                        type: string
                      name:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/signUp:
    post:
      tags:
        - Users
      summary: Create new user
      description: Register a new user (requires authentication and role check)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - phoneNumber
                - state
                - city
                - status
                - password
              properties:
                name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  format: email
                  example: john@example.com
                phoneNumber:
                  type: string
                  example: '9876543210'
                state:
                  type: string
                  example: Maharashtra
                city:
                  type: string
                  example: Mumbai
                role:
                  type: string
                  enum: [user, admin, super_admin]
                  default: user
                status:
                  type: string
                  example: active
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/editUser:
    post:
      tags:
        - Users
      summary: Edit existing user
      description: Update user information (requires authentication and role check)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - _id
                - name
                - email
                - phoneNumber
                - state
                - city
                - status
                - password
              properties:
                _id:
                  type: string
                  example: 60d5ec49f1b2c72b8c8e4f1a
                name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  format: email
                  example: john@example.com
                phoneNumber:
                  type: string
                  example: '9876543210'
                state:
                  type: string
                  example: Maharashtra
                city:
                  type: string
                  example: Mumbai
                role:
                  type: string
                  enum: [user, admin, super_admin]
                status:
                  type: string
                  example: active
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/updateUserStatus:
    put:
      tags:
        - Users
      summary: Update user status
      description: Change user active/inactive status (requires authentication and role check)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - status
              properties:
                id:
                  type: string
                  example: 60d5ec49f1b2c72b8c8e4f1a
                status:
                  type: string
                  example: active
      responses:
        '200':
          description: Status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/sendOTP:
    post:
      tags:
        - Users
      summary: Send OTP to email
      description: Send one-time password to user email for verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/verifyEmailOtp:
    post:
      tags:
        - Users
      summary: Verify email OTP
      description: Verify the OTP sent to user's email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                otp:
                  type: string
                  example: '123456'
      responses:
        '200':
          description: OTP verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Invalid OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/getAllUsers:
    get:
      tags:
        - Users
      summary: Get all users
      description: Retrieve list of all users (requires authentication and role check)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/reset/Password:
    post:
      tags:
        - Users
      summary: Reset password
      description: Reset user password with new password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - newPassword
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                newPassword:
                  type: string
                  format: password
                  example: newPassword123
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/refresh-token:
    post:
      tags:
        - Users
      summary: Refresh access token
      description: Use refresh token to obtain new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  authToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
